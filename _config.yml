title: Wenzhe Zhang's Notebook
lang: en
description: Wenzhe Zhang's Notebook, recoding my working and study notes

theme: null

# debug:
#   compress: true
#   dist: false
#   shortcodes: true

readme_index:
  with_frontmatter: true

jekyll-rushed-analytics:
  GoogleAnalytics4:
    measurement_id: G-93D140SBX5

plugins:
  - jemoji
  - jekyll-avatar
  - jekyll-mentions
  - jekyll-rushed-analytics

exclude:
  - Makefile
  - CNAME
  - LICENSE
  - update.sh
  - Gemfile
  - Gemfile.lock
  - requirements.txt
  - node_modules
  - package.json
  - package-lock.json
  - webpack.config.js
  - jekyll-rtd-theme.gemspec
